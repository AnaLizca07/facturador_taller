<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Facturador Taller</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #F4F3EF;
    color: #2C2C2A;
    padding-bottom: 100px;
  }
  header {
    background: #1B2A4A;
    color: white;
    padding: 18px 16px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
  }
  header p {
    margin: 4px 0 0;
    font-size: 13px;
    color: #C9D2E3;
  }
  .container {
    padding: 16px;
    max-width: 480px;
    margin: 0 auto;
  }
  #search-box {
    position: relative;
    margin-top: 4px;
  }
  #search-input {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    border: 2px solid #1B2A4A;
    border-radius: 12px;
    background: white;
  }
  #search-input:focus {
    outline: none;
  }
  #results {
    margin-top: 8px;
    background: white;
    border-radius: 12px;
    overflow-y: auto;
    max-height: 340px;
    border: 1px solid #E5E3DA;
    display: none;
  }
  .results-hint {
    padding: 10px 16px;
    font-size: 12px;
    color: #888780;
    background: #FAFAF7;
    border-bottom: 1px solid #EFEDE5;
    position: sticky;
    top: 0;
  }
  .result-item {
    padding: 14px 16px;
    border-bottom: 1px solid #EFEDE5;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .result-item:last-child { border-bottom: none; }
  .result-item:active { background: #F4F3EF; }
  .result-code {
    font-size: 12px;
    color: #888780;
    font-weight: 600;
  }
  .result-name {
    font-size: 15px;
    margin-top: 2px;
  }
  .result-item .add-icon {
    font-size: 22px;
    color: #1B2A4A;
    padding-left: 12px;
  }
  #no-results {
    padding: 16px;
    text-align: center;
    color: #888780;
    font-size: 14px;
    display: none;
  }
  .cart-section {
    margin-top: 24px;
  }
  .cart-section h2 {
    font-size: 15px;
    font-weight: 600;
    color: #5F5E5A;
    margin-bottom: 10px;
  }
  #cart-empty {
    text-align: center;
    padding: 32px 16px;
    color: #B4B2A9;
    font-size: 14px;
    background: white;
    border-radius: 12px;
    border: 1px dashed #D3D1C7;
  }
  .cart-item {
    background: white;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid #E5E3DA;
  }
  .cart-item-info {
    flex: 1;
    min-width: 0;
  }
  .cart-item-code {
    font-size: 11px;
    color: #888780;
    font-weight: 600;
  }
  .cart-item-name {
    font-size: 14px;
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .qty-control {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .qty-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid #D3D1C7;
    background: #F4F3EF;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1B2A4A;
    font-weight: 600;
  }
  .qty-btn:active { background: #E5E3DA; }
  .qty-value {
    min-width: 24px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
  }
  .remove-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: #A32D2D;
    font-size: 18px;
    flex-shrink: 0;
  }
  .send-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    border-top: 1px solid #E5E3DA;
    padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  .send-bar-inner {
    max-width: 480px;
    margin: 0 auto;
  }
  #send-btn {
    width: 100%;
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    background: #25D366;
    color: white;
    border: none;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  #send-btn:disabled {
    background: #D3D1C7;
    color: #888780;
  }
  #send-btn:active:not(:disabled) {
    opacity: 0.85;
  }
  .item-count {
    font-size: 12px;
    color: #888780;
    text-align: center;
    margin-top: 6px;
  }
</style>
</head>
<body>

<header>
  <h1>Facturador de taller</h1>
  <p>Busca el producto, pon la cantidad y envía por WhatsApp</p>
</header>

<div class="container">

  <div id="search-box">
    <input type="text" id="search-input" placeholder="Buscar producto por nombre o código...">
    <div id="results"></div>
    <div id="no-results">No se encontraron productos.</div>
  </div>

  <div class="cart-section">
    <h2>Pedido</h2>
    <div id="cart-empty">Todavía no has agregado productos.</div>
    <div id="cart-list"></div>
  </div>

</div>

<div class="send-bar">
  <div class="send-bar-inner">
    <button id="send-btn" disabled>Enviar pedido por WhatsApp</button>
    <div class="item-count" id="item-count"></div>
  </div>
</div>

<script>
// ==== CONFIGURACIÓN ====
// Número de WhatsApp que recibe los pedidos (código de país + número, sin +, sin espacios)
const NUMERO_WHATSAPP = "3001234567";

// Link CSV publicado del Google Sheet (Archivo > Compartir > Publicar en la web > CSV)
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSJkVe1wAoLN6tWfpxjSUZsuRxUF7ng8IWAueJRSEmBZeTgV_F5YkRFW9oE6ynXMNCpnlCo4kBKWdwG/pub?gid=0&single=true&output=csv";

let PRODUCTOS = [];

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const char = line[i];
    if (char === '"') {
      if (inQuotes && line[i + 1] === '"') { current += '"'; i++; }
      else { inQuotes = !inQuotes; }
    } else if (char === ',' && !inQuotes) {
      result.push(current);
      current = '';
    } else {
      current += char;
    }
  }
  result.push(current);
  return result;
}

function parseCSV(text) {
  const lines = text.split(/\r\n|\n/).filter(l => l.trim() !== '');
  const productos = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = parseCSVLine(lines[i]);
    const codigo = (cols[0] || '').trim();
    const nombre = (cols[1] || '').trim();
    if (codigo && nombre) {
      productos.push({ codigo, nombre });
    }
  }
  return productos;
}

async function cargarCatalogo() {
  const searchInput = document.getElementById('search-input');
  searchInput.disabled = true;
  searchInput.placeholder = "Cargando catálogo...";
  try {
    const res = await fetch(SHEET_CSV_URL + '&t=' + Date.now());
    if (!res.ok) throw new Error('No se pudo cargar el catálogo');
    const text = await res.text();
    PRODUCTOS = parseCSV(text);
  } catch (err) {
    document.getElementById('no-results').textContent = 'No se pudo cargar el catálogo. Verifica tu conexión.';
    document.getElementById('no-results').style.display = 'block';
  } finally {
    searchInput.disabled = false;
    searchInput.placeholder = "Buscar producto por nombre o código...";
  }
}

// ==== ESTADO ====
let carrito = {}; // { codigo: { codigo, nombre, cantidad } }

// ==== BÚSQUEDA ====
const searchInput = document.getElementById('search-input');
const resultsBox = document.getElementById('results');
const noResults = document.getElementById('no-results');

function normalizar(texto) {
  return texto.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function buscar(query) {
  const q = normalizar(query.trim());
  const mostrarTodos = q === '';
  const matches = mostrarTodos
    ? PRODUCTOS
    : PRODUCTOS.filter(p =>
        normalizar(p.nombre).includes(q) || normalizar(p.codigo).includes(q)
      );

  if (matches.length === 0) {
    resultsBox.style.display = 'none';
    noResults.style.display = 'block';
    return;
  }

  noResults.style.display = 'none';
  resultsBox.style.display = 'block';

  const hint = mostrarTodos
    ? `<div class="results-hint">${PRODUCTOS.length} productos · desliza para ver todos</div>`
    : `<div class="results-hint">${matches.length} resultado${matches.length !== 1 ? 's' : ''}</div>`;

  resultsBox.innerHTML = hint + matches.map(p => `
    <div class="result-item" data-codigo="${p.codigo}">
      <div>
        <div class="result-code">${p.codigo}</div>
        <div class="result-name">${p.nombre}</div>
      </div>
      <div class="add-icon">+</div>
    </div>
  `).join('');

  resultsBox.querySelectorAll('.result-item').forEach(el => {
    el.addEventListener('click', () => {
      agregarAlCarrito(el.dataset.codigo);
      searchInput.value = '';
      searchInput.blur();
      resultsBox.style.display = 'none';
    });
  });
}

searchInput.addEventListener('input', (e) => buscar(e.target.value));
searchInput.addEventListener('focus', () => buscar(searchInput.value));

document.addEventListener('click', (e) => {
  if (!searchInput.contains(e.target) && !resultsBox.contains(e.target)) {
    resultsBox.style.display = 'none';
  }
});

// ==== CARRITO ====
function agregarAlCarrito(codigo) {
  const producto = PRODUCTOS.find(p => p.codigo === codigo);
  if (!producto) return;
  if (carrito[codigo]) {
    carrito[codigo].cantidad += 1;
  } else {
    carrito[codigo] = { codigo: producto.codigo, nombre: producto.nombre, cantidad: 1 };
  }
  renderCarrito();
}

function cambiarCantidad(codigo, delta) {
  if (!carrito[codigo]) return;
  carrito[codigo].cantidad += delta;
  if (carrito[codigo].cantidad <= 0) {
    delete carrito[codigo];
  }
  renderCarrito();
}

function quitarDelCarrito(codigo) {
  delete carrito[codigo];
  renderCarrito();
}

function renderCarrito() {
  const cartList = document.getElementById('cart-list');
  const cartEmpty = document.getElementById('cart-empty');
  const sendBtn = document.getElementById('send-btn');
  const itemCount = document.getElementById('item-count');
  const items = Object.values(carrito);

  if (items.length === 0) {
    cartEmpty.style.display = 'block';
    cartList.innerHTML = '';
    sendBtn.disabled = true;
    itemCount.textContent = '';
    return;
  }

  cartEmpty.style.display = 'none';
  sendBtn.disabled = false;

  cartList.innerHTML = items.map(item => `
    <div class="cart-item">
      <div class="cart-item-info">
        <div class="cart-item-code">${item.codigo}</div>
        <div class="cart-item-name">${item.nombre}</div>
      </div>
      <div class="qty-control">
        <button class="qty-btn" data-action="menos" data-codigo="${item.codigo}">−</button>
        <span class="qty-value">${item.cantidad}</span>
        <button class="qty-btn" data-action="mas" data-codigo="${item.codigo}">+</button>
      </div>
      <button class="remove-btn" data-action="quitar" data-codigo="${item.codigo}">✕</button>
    </div>
  `).join('');

  cartList.querySelectorAll('[data-action="mas"]').forEach(el =>
    el.addEventListener('click', () => cambiarCantidad(el.dataset.codigo, 1))
  );
  cartList.querySelectorAll('[data-action="menos"]').forEach(el =>
    el.addEventListener('click', () => cambiarCantidad(el.dataset.codigo, -1))
  );
  cartList.querySelectorAll('[data-action="quitar"]').forEach(el =>
    el.addEventListener('click', () => quitarDelCarrito(el.dataset.codigo))
  );

  const totalUnidades = items.reduce((sum, i) => sum + i.cantidad, 0);
  itemCount.textContent = `${items.length} producto${items.length !== 1 ? 's' : ''} · ${totalUnidades} unidad${totalUnidades !== 1 ? 'es' : ''}`;
}

// ==== ENVIAR POR WHATSAPP ====
document.getElementById('send-btn').addEventListener('click', () => {
  const items = Object.values(carrito);
  if (items.length === 0) return;

  const fecha = new Date().toLocaleDateString('es-CO');

  let mensaje = `*Nuevo pedido - Taller*\n`;
  mensaje += `Fecha: ${fecha}\n\n`;
  items.forEach(item => {
    mensaje += `${item.cantidad}x ${item.codigo} - ${item.nombre}\n`;
  });

  const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`;
  window.open(url, '_blank');
});

renderCarrito();
cargarCatalogo();
</script>

</body>
</html>
